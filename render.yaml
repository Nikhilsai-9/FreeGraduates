services:
  - type: web
    name: freegraduates-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEV_AUTH_BYPASS
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      # MUST include the production frontend origin (Vercel), e.g.:
      #   CLIENT_ORIGINS=https://your-app.vercel.app
      - key: CLIENT_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false