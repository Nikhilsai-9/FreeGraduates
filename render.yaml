services:
  - type: web
    name: freegraduates-backend
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEV_AUTH_BYPASS
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: CLIENT_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
